<!doctype html>
<html>
<head><meta charset="utf-8"/></head>
<body>
<script>
const params = new URLSearchParams(location.search);
const code  = params.get('code');
const state = params.get('state');
if(state !== sessionStorage.gh_state){ document.body.textContent='Estado inválido'; }
else {
  fetch('https://github.com/login/oauth/access_token',{
    method:'POST',
    headers:{'Accept':'application/json','Content-Type':'application/json'},
    body:JSON.stringify({
      client_id:'Ov23liWrlE15XsTwTmVH',
      client_secret:'c417a59e69a48e85c9726d1af01acc0a49c146fa',
      code:code
    })
  })
  .then(r=>r.json())
  .then(d=>{
    sessionStorage.gh_token = d.access_token;
    location.href = sessionStorage.gh_redirect || '/';
  });
}
</script>
</body>
</html>
