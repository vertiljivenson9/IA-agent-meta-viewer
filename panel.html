<!doctype html>
<html lang="es">
<head><meta charset="utf-8"/></head>
<body>
<h3>Selecciona tu repositorio</h3>
<select id="repos"></select>
<button id="clone">Clone / Descargar ZIP</button>

<script>
const token = sessionStorage.gh_token;
if(!token) location.href = 'index.html';

// listar repos
fetch('https://api.github.com/user/repos?per_page=100',{
  headers:{Authorization:`token ${token}`}
})
.then(r=>r.json())
.then(arr => {
  arr.forEach(r => {
    const o = document.createElement('option');
    o.value = r.full_name;
    o.text  = r.full_name;
    repos.appendChild(o);
  });
});

// descargar ZIP (equivale a clonar)
clone.onclick = () => {
  const repo = repos.value;
  location.href = `https://github.com/${repo}/archive/refs/heads/main.zip`;
};
</script>
</body>
</html>
